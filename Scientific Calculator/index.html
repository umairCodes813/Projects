<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXIOM fx-100 — Scientific Calculator</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
      :root {
        --body-1: #1b1e24;
        --body-2: #26292f;
        --screen-bg: #cfe3d4;
        --screen-bg-2: #bcd8c3;
        --screen-text: #16281c;
        --key-num: #3a3f47;
        --key-num-text: #f2f3f5;
        --key-func: #23262c;
        --key-func-text: #d7dade;
        --key-op: #454b54;
        --key-op-text: #ffffff;
        --accent-amber: #e8a13d;
        --accent-red: #d8583f;
        --accent-green: #3d8f6b;
        --accent-blue: #4c8fd6;
        --shift-glow: #e8a13d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: radial-gradient(circle at 30% 0%, #2b3038, #101216 75%);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
      }

      .calc-wrap {
        width: 100%;
        max-width: 380px;
      }

      .calculator {
        background: linear-gradient(160deg, var(--body-2), var(--body-1) 60%);
        border-radius: 22px;
        padding: 18px 16px 22px;
        box-shadow:
          0 30px 60px -20px rgba(0, 0, 0, 0.7),
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          inset 0 -2px 6px rgba(0, 0, 0, 0.5);
        position: relative;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2px 6px 12px;
      }
      .brand-name {
        color: #8b929c;
        font-weight: 700;
        letter-spacing: 2px;
        font-size: 13px;
      }
      .brand-name span {
        color: var(--accent-amber);
      }
      .brand-sub {
        color: #5b606a;
        font-size: 9px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      /* SCREEN */
      .screen {
        background: linear-gradient(
          180deg,
          var(--screen-bg),
          var(--screen-bg-2)
        );
        border-radius: 10px;
        padding: 10px 14px 12px;
        margin-bottom: 14px;
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.35),
          inset 0 -1px 0 rgba(255, 255, 255, 0.3);
        position: relative;
        overflow: hidden;
      }
      .screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.03) 0px,
          rgba(0, 0, 0, 0.03) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
      }
      .screen-indicators {
        display: flex;
        gap: 10px;
        font-size: 10px;
        font-weight: 700;
        color: rgba(22, 40, 28, 0.45);
        letter-spacing: 1px;
        height: 14px;
      }
      .screen-indicators .ind {
        opacity: 0.25;
        transition: opacity 0.15s;
      }
      .screen-indicators .ind.active {
        opacity: 1;
        color: #1f4a30;
      }

      .history-line {
        min-height: 18px;
        text-align: right;
        font-family: "Courier New", monospace;
        font-size: 14px;
        color: rgba(22, 40, 28, 0.6);
        overflow-x: auto;
        white-space: nowrap;
        margin-top: 2px;
      }
      .main-line {
        text-align: right;
        font-family: "Courier New", monospace;
        font-weight: 700;
        font-size: clamp(24px, 8vw, 32px);
        color: var(--screen-text);
        min-height: 40px;
        overflow-x: auto;
        white-space: nowrap;
        letter-spacing: 0.5px;
        margin-top: 2px;
      }
      .history-line::-webkit-scrollbar,
      .main-line::-webkit-scrollbar {
        display: none;
      }

      /* KEY GRIDS */
      .grid {
        display: grid;
        gap: 7px;
        margin-bottom: 7px;
      }
      .grid-5 {
        grid-template-columns: repeat(5, 1fr);
      }
      .grid-4 {
        grid-template-columns: repeat(4, 1fr);
      }

      button.key {
        position: relative;
        border: none;
        border-radius: 9px;
        padding: 10px 2px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        color: var(--key-func-text);
        background: linear-gradient(180deg, #2c2f36, #1e2126);
        box-shadow:
          0 2px 0 rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        transition:
          transform 0.05s ease,
          box-shadow 0.05s ease;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      button.key:active {
        transform: translateY(2px);
        box-shadow:
          0 0 0 rgba(0, 0, 0, 0.5),
          inset 0 1px 3px rgba(0, 0, 0, 0.4);
      }

      .shift-tag {
        position: absolute;
        top: 2px;
        left: 5px;
        font-size: 8px;
        font-weight: 700;
        color: var(--accent-amber);
        letter-spacing: 0.3px;
        opacity: 0.85;
      }

      .key.num {
        background: linear-gradient(180deg, #494f58, #363b42);
        color: var(--key-num-text);
        font-size: 16px;
      }
      .key.op {
        background: linear-gradient(180deg, #55606e, #3c4550);
        color: var(--key-op-text);
        font-size: 17px;
      }
      .key.accent-red {
        background: linear-gradient(180deg, #e0654c, #b8402a);
        color: #fff;
      }
      .key.accent-green {
        background: linear-gradient(180deg, #4aa87f, #2f7a5a);
        color: #fff;
        font-size: 17px;
      }
      .key.accent-blue {
        background: linear-gradient(180deg, #5b9de0, #3d76b8);
        color: #fff;
      }
      .key.shift-on {
        background: linear-gradient(180deg, #f0b45c, #d1892b);
        color: #241703;
        box-shadow:
          0 0 10px 1px rgba(232, 161, 61, 0.6),
          0 2px 0 rgba(0, 0, 0, 0.5);
      }
      .key.mode-on {
        background: linear-gradient(180deg, #5b9de0, #3d76b8);
        color: #fff;
      }

      .zero-cell {
        grid-column: span 2;
      }
      .equals-row {
        grid-template-columns: 1fr;
      }
      .key.equals {
        padding: 12px 2px;
        font-size: 18px;
        letter-spacing: 1px;
      }

      .footer-note {
        text-align: center;
        color: #4c5057;
        font-size: 10px;
        margin-top: 12px;
        letter-spacing: 0.5px;
      }

      @media (max-width: 360px) {
        button.key {
          font-size: 12.5px;
          padding: 9px 2px;
        }
        .key.num {
          font-size: 14.5px;
        }
      }
    </style>
  </head>
  <body>
    <div class="calc-wrap">
      <div class="calculator">
        <div class="brand">
          <div class="brand-name">AXIOM <span>fx-100</span></div>
          <div class="brand-sub">Natural Display</div>
        </div>

        <div class="screen">
          <div class="screen-indicators">
            <span class="ind" id="ind-shift">SHIFT</span>
            <span class="ind active" id="ind-deg">DEG</span>
            <span class="ind" id="ind-rad">RAD</span>
            <span class="ind" id="ind-m">M</span>
          </div>
          <div class="history-line" id="historyLine">&nbsp;</div>
          <div class="main-line" id="mainLine">0</div>
        </div>

        <!-- Function grid -->
        <div class="grid grid-5">
          <button class="key" id="btnShift" data-action="shift">SHIFT</button>
          <button class="key mode-btn" data-action="mode">MODE</button>
          <button class="key" data-action="paren-open">(</button>
          <button class="key" data-action="paren-close">)</button>
          <button class="key" data-action="ans">Ans</button>

          <button class="key" data-action="xinv">
            <span class="shift-tag">x³</span>x⁻¹
          </button>
          <button class="key" data-action="xsq">
            <span class="shift-tag">√</span>x²
          </button>
          <button class="key" data-action="sqrt">
            <span class="shift-tag">3√</span>√
          </button>
          <button class="key" data-action="pow">
            <span class="shift-tag">ʸ√x</span>x^y
          </button>
          <button class="key" data-action="exp">
            <span class="shift-tag">π</span>×10ˣ
          </button>

          <button class="key" data-action="sin">
            <span class="shift-tag">sin⁻¹</span>sin
          </button>
          <button class="key" data-action="cos">
            <span class="shift-tag">cos⁻¹</span>cos
          </button>
          <button class="key" data-action="tan">
            <span class="shift-tag">tan⁻¹</span>tan
          </button>
          <button class="key" data-action="log">
            <span class="shift-tag">10ˣ</span>log
          </button>
          <button class="key" data-action="ln">
            <span class="shift-tag">eˣ</span>ln
          </button>

          <button class="key" data-action="mc">MC</button>
          <button class="key" data-action="mr">MR</button>
          <button class="key" data-action="mplus">M+</button>
          <button class="key" data-action="pm">±</button>
          <button class="key accent-red" data-action="ac">AC</button>
        </div>

        <!-- Numeric grid -->
        <div class="grid grid-4">
          <button class="key num" data-action="digit" data-value="7">7</button>
          <button class="key num" data-action="digit" data-value="8">8</button>
          <button class="key num" data-action="digit" data-value="9">9</button>
          <button class="key op" data-action="del">DEL</button>

          <button class="key num" data-action="digit" data-value="4">4</button>
          <button class="key num" data-action="digit" data-value="5">5</button>
          <button class="key num" data-action="digit" data-value="6">6</button>
          <button class="key op" data-action="div">÷</button>

          <button class="key num" data-action="digit" data-value="1">1</button>
          <button class="key num" data-action="digit" data-value="2">2</button>
          <button class="key num" data-action="digit" data-value="3">3</button>
          <button class="key op" data-action="mul">×</button>

          <button class="key num" data-action="percent">%</button>
          <button class="key num zero-cell" data-action="digit" data-value="0">
            0
          </button>
          <button class="key num" data-action="dot">.</button>
          <button class="key op" data-action="sub">−</button>
        </div>

        <div class="grid grid-4" style="grid-template-columns: 1fr 1fr 2fr">
          <button class="key" data-action="fact">x!</button>
          <button class="key" data-action="pi">π</button>
          <button class="key op" data-action="add">+</button>
        </div>

        <div class="grid equals-row">
          <button class="key accent-green equals" data-action="equals">
            =
          </button>
        </div>

        <div class="footer-note">
          DEG / RAD · SHIFT for inverse &amp; alt functions
        </div>
      </div>
    </div>
    <!-- <script src="script.js"></script> -->
    <script>
      (function () {
        const state = {
          expr: "",
          history: "",
          ans: 0,
          memory: 0,
          shift: false,
          angleMode: "DEG", // 'DEG' or 'RAD'
          justEvaluated: false,
        };

        const mainLine = document.getElementById("mainLine");
        const historyLine = document.getElementById("historyLine");
        const indShift = document.getElementById("ind-shift");
        const indDeg = document.getElementById("ind-deg");
        const indRad = document.getElementById("ind-rad");
        const indM = document.getElementById("ind-m");
        const btnShift = document.getElementById("btnShift");

        const AFTER_VALUE_ALL = /[0-9a-zA-Z)%!π]/; // used for openers (functions, constants, '(', Ans, MR)
        const AFTER_VALUE_NO_DIGIT = /[a-zA-Z)%!π]/; // used for digits (don't insert × between two digits)

        function render() {
          mainLine.textContent = state.expr.length ? prettify(state.expr) : "0";
          historyLine.textContent = state.history || "\u00A0";
          indShift.classList.toggle("active", state.shift);
          btnShift.classList.toggle("shift-on", state.shift);
          indDeg.classList.toggle("active", state.angleMode === "DEG");
          indRad.classList.toggle("active", state.angleMode === "RAD");
          indM.classList.toggle("active", state.memory !== 0);
        }

        function prettify(s) {
          // Cosmetic only - what's shown, not what's evaluated (evaluated string is generated separately)
          return s;
        }

        function smartAppend(tok, re) {
          if (state.expr.length && re.test(state.expr[state.expr.length - 1])) {
            state.expr += "×";
          }
          state.expr += tok;
          render();
        }

        function rawAppend(tok) {
          state.expr += tok;
          render();
        }

        function beforeInput(isContinuation) {
          if (state.justEvaluated) {
            if (isContinuation) {
              state.expr = "Ans";
            } else {
              state.expr = "";
              state.history = "";
            }
            state.justEvaluated = false;
          }
        }

        // ---- Math engine ----
        function toRad(x) {
          return state.angleMode === "DEG" ? (x * Math.PI) / 180 : x;
        }
        function fromRad(x) {
          return state.angleMode === "DEG" ? (x * 180) / Math.PI : x;
        }

        const CALC = {
          sin: (x) => Math.sin(toRad(x)),
          cos: (x) => Math.cos(toRad(x)),
          tan: (x) => Math.tan(toRad(x)),
          asin: (x) => fromRad(Math.asin(x)),
          acos: (x) => fromRad(Math.acos(x)),
          atan: (x) => fromRad(Math.atan(x)),
          log10: (x) => Math.log10(x),
          ln: (x) => Math.log(x),
          fact: (n) => {
            n = Math.round(n);
            if (n < 0) return NaN;
            let r = 1;
            for (let i = 2; i <= n; i++) r *= i;
            return r;
          },
        };

        function autoCloseParens(s) {
          let open = 0;
          for (const ch of s) {
            if (ch === "(") open++;
            else if (ch === ")") open--;
          }
          if (open > 0) s += ")".repeat(open);
          return s;
        }

        function toEvalString(displayExpr) {
          let s = autoCloseParens(displayExpr);

          // Ans
          s = s.replace(/Ans/g, "(" + state.ans + ")");

          // operators
          s = s.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-");

          // constants
          s = s.replace(/π/g, "(Math.PI)");
          s = s.replace(/(?<![A-Za-z])e(?![A-Za-z(])/g, "(Math.E)");

          // percent -> /100
          s = s.replace(/%/g, "/100");

          // factorial (numbers only)
          s = s.replace(/(\d+(?:\.\d+)?)!/g, "CALC.fact($1)");

          // functions - longer names first to avoid partial matches
          s = s
            .replace(/asin\(/g, "CALC.asin(")
            .replace(/acos\(/g, "CALC.acos(")
            .replace(/atan\(/g, "CALC.atan(")
            .replace(/sin\(/g, "CALC.sin(")
            .replace(/cos\(/g, "CALC.cos(")
            .replace(/tan\(/g, "CALC.tan(")
            .replace(/log\(/g, "CALC.log10(")
            .replace(/ln\(/g, "CALC.ln(")
            .replace(/√\(/g, "Math.sqrt(")
            .replace(/∛\(/g, "Math.cbrt(");

          // power
          s = s.replace(/\^/g, "**");

          return s;
        }

        function formatNumber(n) {
          if (typeof n !== "number" || !isFinite(n)) return "Error";
          if (Math.abs(n) > 1e15 || (Math.abs(n) < 1e-10 && n !== 0)) {
            return n.toExponential(6).replace("e", "×10^");
          }
          let rounded = Math.round(n * 1e10) / 1e10;
          return String(rounded);
        }

        function evaluate() {
          if (!state.expr.length) return;
          try {
            const jsExpr = toEvalString(state.expr);
            const raw = new Function("CALC", "return (" + jsExpr + ")")(CALC);
            if (typeof raw !== "number" || isNaN(raw)) throw new Error("bad");
            state.history = state.expr + " =";
            state.ans = Math.round(raw * 1e10) / 1e10;
            state.expr = formatNumber(raw);
            state.justEvaluated = true;
            render();
          } catch (e) {
            state.history = state.expr + " =";
            state.expr = "Error";
            state.justEvaluated = true;
            render();
          }
        }

        // ---- Button handling ----
        function handleAction(action) {
          switch (action) {
            case "shift":
              state.shift = !state.shift;
              render();
              return; // don't consume shift itself

            case "mode":
              state.angleMode = state.angleMode === "DEG" ? "RAD" : "DEG";
              render();
              return;

            case "digit":
              break; // handled by caller with data-value
            case "dot":
              beforeInput(false);
              if (state.expr.length === 0) state.expr = "0";
              rawAppend(".");
              break;

            case "paren-open":
              beforeInput(false);
              smartAppend("(", AFTER_VALUE_ALL);
              break;
            case "paren-close":
              beforeInput(true);
              rawAppend(")");
              break;

            case "ans":
              beforeInput(false);
              smartAppend("Ans", AFTER_VALUE_ALL);
              break;

            case "xinv":
              beforeInput(true);
              rawAppend(state.shift ? "^3" : "^(-1)");
              state.shift = false;
              break;
            case "xsq":
              beforeInput(true);
              if (state.shift) {
                smartAppend("√(", AFTER_VALUE_ALL);
              } else {
                rawAppend("^2");
              }
              state.shift = false;
              break;
            case "sqrt":
              beforeInput(false);
              smartAppend(state.shift ? "∛(" : "√(", AFTER_VALUE_ALL);
              state.shift = false;
              break;
            case "pow":
              beforeInput(true);
              rawAppend("^");
              state.shift = false;
              break;
            case "exp":
              beforeInput(true);
              if (state.shift) {
                smartAppend("π", AFTER_VALUE_ALL);
              } else {
                if (state.expr.length === 0) {
                  rawAppend("10^(");
                } else {
                  rawAppend("×10^(");
                }
              }
              state.shift = false;
              break;

            case "sin":
              beforeInput(false);
              smartAppend(state.shift ? "asin(" : "sin(", AFTER_VALUE_ALL);
              state.shift = false;
              break;
            case "cos":
              beforeInput(false);
              smartAppend(state.shift ? "acos(" : "cos(", AFTER_VALUE_ALL);
              state.shift = false;
              break;
            case "tan":
              beforeInput(false);
              smartAppend(state.shift ? "atan(" : "tan(", AFTER_VALUE_ALL);
              state.shift = false;
              break;
            case "log":
              beforeInput(false);
              smartAppend(state.shift ? "10^(" : "log(", AFTER_VALUE_ALL);
              state.shift = false;
              break;
            case "ln":
              beforeInput(false);
              smartAppend(state.shift ? "e^(" : "ln(", AFTER_VALUE_ALL);
              state.shift = false;
              break;

            case "mc":
              state.memory = 0;
              render();
              return;
            case "mr":
              beforeInput(false);
              smartAppend(formatNumber(state.memory), AFTER_VALUE_ALL);
              break;
            case "mplus": {
              try {
                const jsExpr = toEvalString(
                  state.expr.length ? state.expr : String(state.ans),
                );
                const val = new Function("CALC", "return (" + jsExpr + ")")(
                  CALC,
                );
                if (typeof val === "number" && isFinite(val))
                  state.memory += val;
              } catch (e) {
                /* ignore */
              }
              render();
              return;
            }
            case "pm":
              if (state.expr.length) {
                if (state.expr.startsWith("-(") && state.expr.endsWith(")")) {
                  state.expr = state.expr.slice(2, -1);
                } else {
                  state.expr = "-(" + state.expr + ")";
                }
                render();
              }
              return;
            case "ac":
              state.expr = "";
              state.history = "";
              state.justEvaluated = false;
              state.shift = false;
              render();
              return;
            case "del":
              if (state.justEvaluated) {
                state.expr = "";
                state.history = "";
                state.justEvaluated = false;
              } else {
                state.expr = state.expr.slice(0, -1);
              }
              render();
              return;

            case "div":
              beforeInput(true);
              rawAppend("÷");
              state.shift = false;
              break;
            case "mul":
              beforeInput(true);
              rawAppend("×");
              state.shift = false;
              break;
            case "sub":
              beforeInput(true);
              rawAppend("−");
              state.shift = false;
              break;
            case "add":
              beforeInput(true);
              rawAppend("+");
              state.shift = false;
              break;

            case "percent":
              beforeInput(true);
              rawAppend("%");
              state.shift = false;
              break;
            case "fact":
              beforeInput(true);
              rawAppend("!");
              state.shift = false;
              break;
            case "pi":
              beforeInput(false);
              smartAppend("π", AFTER_VALUE_ALL);
              state.shift = false;
              break;

            case "equals":
              evaluate();
              return;

            default:
              return;
          }
          render();
        }

        document.querySelectorAll(".key").forEach((btn) => {
          btn.addEventListener("click", () => {
            const action = btn.dataset.action;
            if (action === "digit") {
              beforeInput(false);
              const d = btn.dataset.value;
              smartAppend(d, AFTER_VALUE_NO_DIGIT);
              state.shift = false;
              return;
            }
            handleAction(action);
          });
        });

        // ---- Keyboard support ----
        window.addEventListener("keydown", (e) => {
          const k = e.key;
          if (/^[0-9]$/.test(k)) {
            beforeInput(false);
            smartAppend(k, AFTER_VALUE_NO_DIGIT);
            return;
          }
          if (k === ".") {
            handleAction("dot");
            return;
          }
          if (k === "+") {
            handleAction("add");
            return;
          }
          if (k === "-") {
            handleAction("sub");
            return;
          }
          if (k === "*") {
            handleAction("mul");
            return;
          }
          if (k === "/") {
            e.preventDefault();
            handleAction("div");
            return;
          }
          if (k === "(") {
            handleAction("paren-open");
            return;
          }
          if (k === ")") {
            handleAction("paren-close");
            return;
          }
          if (k === "^") {
            handleAction("pow");
            return;
          }
          if (k === "%") {
            handleAction("percent");
            return;
          }
          if (k === "Enter" || k === "=") {
            e.preventDefault();
            handleAction("equals");
            return;
          }
          if (k === "Backspace") {
            handleAction("del");
            return;
          }
          if (k === "Escape") {
            handleAction("ac");
            return;
          }
        });

        render();
      })();
    </script>
